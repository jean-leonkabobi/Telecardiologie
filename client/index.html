<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Pas de `maximum-scale` : le bloquer empêche le zoom à deux doigts, ce que
      les règles d'accessibilité interdisent (WCAG 1.4.4). Sur une application où
      l'on examine un tracé et où l'utilisateur peut être presbyte, c'est la
      dernière chose à verrouiller.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Plateforme de Télécardiologie Assistée par IA</title>
    <meta
      name="description"
      content="Soumission, analyse assistée par IA et validation par un cardiologue de tracés électrocardiographiques."
    />

    <!--
      Teinte de l'interface du navigateur sur mobile, accordée au fond de
      l'application dans chaque mode. Sans cela, la barre d'adresse reste blanche
      au-dessus d'une application en mode sombre.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf5f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#110c0b"
    />

    <!--
      Inter est auto-hébergée (client/src/fonts.css) et non chargée depuis Google
      Fonts : voir ce fichier pour les trois raisons — confidentialité des postes
      soignants, fiabilité sur un réseau filtré, et graisses variables.
    -->

    <!-- Logo servi depuis client/public : contrairement à /manus-storage,
         il existe aussi dans le build de production. -->
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <!--
      Applique le mode de couleur enregistré avant le premier rendu, pour éviter
      un flash clair au rechargement en mode sombre.

      Ce script remplace <InitColorSchemeScript /> de MUI, qui ne produit rien
      dans une application purement client : il ne s'émet que pendant le rendu
      serveur et l'hydratation, or l'app est montée par createRoot().

      Doit rester aligné sur le thème (client/src/theme/index.ts) :
      colorSchemeSelector 'class' => classe `light` / `dark` sur <html>,
      mode lu dans localStorage sous la clé `mui-mode`.
    -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("mui-mode") || "light";
          if (mode === "system") {
            mode = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.classList.add(mode);
        } catch (e) {
          /* localStorage indisponible : on reste en mode clair */
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!--
      Le gabarit d'origine embarquait ici une balise de mesure d'audience dont
      l'adresse venait de `%VITE_ANALYTICS_ENDPOINT%`. Ces variables n'étant pas
      définies, le build livrait l'espace réservé tel quel : chaque chargement
      demandait « /%VITE_ANALYTICS_ENDPOINT%/umami », recevait la page HTML de
      repli et échouait sur une erreur de type MIME.

      Retirée plutôt que réparée : dans une application de santé, un traceur tiers
      relève d'une décision explicite — pas d'un résidu de gabarit.
    -->
  </body>
</html>
