# Construction et publication de l'image Docker du frontend — Docker Hub.
#
# Mêmes principes que le backend : voir
# telecardiologie-backend/.github/workflows/docker.yml pour le détail. Ce
# fichier est réutilisable (`workflow_call`), appelé uniquement par
# `pipeline.yml` sur un push vers `main`, après succès de `ci` et `security`.

name: Docker Build & Push (Docker Hub)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/telecardio-web
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que les secrets Docker Hub sont configurés
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::DOCKERHUB_USERNAME et/ou DOCKERHUB_TOKEN manquants. Voir DEVOPS.md, section Secrets."
            exit 1
          fi

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Métadonnées de l'image (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "\`docker.io/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://hub.docker.com/r/${{ env.IMAGE_NAME }}/tags" >> "$GITHUB_STEP_SUMMARY"
